[package]
name = "secretary"
version = "0.1.0"
description = "Personal AI secretary for Jira Cloud and Data Center"
authors = ["Rick Liu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "secretary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
keyring = "4"
# OS trust store in addition to the bundled roots, so corporate TLS-inspection
# certificates installed on the machine are accepted.
tauri-plugin-http = { version = "~2.6", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "http2", "charset", "system-proxy", "cookies"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

# Quick capture (D48): a global shortcut, and one running instance that a second
# launch (`secretary --capture`) forwards to. Pinned to the releases for tauri 2.11
# (the next ones need tauri 2.12 and a matching @tauri-apps/api).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "~2.3"
tauri-plugin-single-instance = "~2.4"

# Checks for the tray library before tray-icon loads it, since a missing one panics.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.7"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
